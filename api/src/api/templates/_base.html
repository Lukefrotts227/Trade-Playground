<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Trade Playground</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.4rem; }
    textarea, input[type=text] { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 8px; }
    textarea { height: 80px; }
    button { margin-top: 12px; padding: 8px 16px; font-size: 1rem; cursor: pointer; }
    .box { background: #f5f5f5; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .rule { font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; }
    .metric { display: inline-block; margin-right: 24px; }
    .metric b { display: block; font-size: 1.3rem; }
  </style>
</head>
<body>
  <h1><a href="/" style="text-decoration:none;color:inherit;">Trade Playground</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
